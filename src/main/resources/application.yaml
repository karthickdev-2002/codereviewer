spring:
  application:
    name: codesage

  # Thymeleaf template configuration
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # File upload configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server configuration
server:
  port: 8080

